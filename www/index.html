<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="imagenes/favicon.png">
    <meta name="msapplication-TileColor" content="#ffffff">
    <meta name="theme-color" content="#ffffff">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Visor GIS de la Autoridad Nacional del Agua - Madre de Dios">
    <title>Visor AAA Madre de Dios</title>

    <!-- Leaflet (local) -->
    <link rel="stylesheet" href="leaflet/leaflet.css">
    <script src="leaflet/leaflet.js"></script>

    <!-- Librerías de clusterización y utilidades (LOCAL — offline-first) -->
    <link rel="stylesheet" href="leaflet/MarkerCluster.css">
    <link rel="stylesheet" href="leaflet/MarkerCluster.Default.css">
    <script src="leaflet/leaflet.markercluster.js"></script>
    <script src="leaflet/jszip.min.js"></script>
    <script src="leaflet/shpwrite.js"></script>
    <script src="leaflet/proj4.js"></script>

    <!-- Estilos -->
    <link rel="stylesheet" href="css/estilosmapa.css?v=6"/>
    <link rel="stylesheet" href="css/celular.css?v=6"/>
    <link rel="stylesheet" href="css/tablet.css?v=6" media="screen and (min-width: 768px)"/>
    <link rel="stylesheet" href="css/computadora.css?v=6" media="screen and (min-width: 1200px)"/>
    <link rel="stylesheet" href="css/estilos.css?v=6"/>
</head>

<body>
    <main class="container">
        <div id="controls" class="controls-collapsed">
            <!-- Header del panel (siempre visible) -->
            <div id="controls-header" onclick="toggleControls()">
                <span id="controls-title"><span id="hamburger-icon">☰</span> <span id="title-text">Controles</span></span>
                <span id="controls-arrow">▲</span>
            </div>

            <!-- Contenido del panel (colapsable) -->
            <div id="controls-body">
                <div class="capa-item">
                    <label><input type="checkbox" id="chkFaja"> Faja Marginal</label>
                    <span class="capa-btns">
                        <button class="btn-descarga" onclick="descargarCapa('faja')">KML</button>
                        <button class="btn-descarga" onclick="descargarCapaShp('faja')">SHP</button>
                    </span>
                </div>
                <div class="capa-item">
                    <label><input type="checkbox" id="chkHito"> Hitos Faja</label>
                    <span class="capa-btns">
                        <button class="btn-descarga" onclick="descargarCapa('hito')">KML</button>
                        <button class="btn-descarga" onclick="descargarCapaShp('hito')">SHP</button>
                    </span>
                </div>
                <div class="capa-item">
                    <label><input type="checkbox" id="chkAut"> Uso Temporal</label>
                    <span class="capa-btns">
                        <button class="btn-descarga" onclick="descargarCapa('uso')">KML</button>
                        <button class="btn-descarga" onclick="descargarCapaShp('uso')">SHP</button>
                    </span>
                </div>
                <div class="capa-item">
                    <label><input type="checkbox" id="chkRadaFuente"> RADA Fuente</label>
                    <span class="capa-btns">
                        <button class="btn-descarga" onclick="descargarCapa('rada')">KML</button>
                        <button class="btn-descarga" onclick="descargarCapaShp('rada')">SHP</button>
                    </span>
                </div>

                <div id="search-box">
                    <input type="text" id="buscar-input" placeholder="Buscar por resolución, CUT, nombre...">
                    <button id="btn-buscar">🔍</button>
                </div>

                <div class="section-title">Coordenadas UTM 19S</div>
                <div id="coords-box" class="mobile-row">
                    <input type="number" id="coord-x" placeholder="Este (X)" step="any" inputmode="decimal">
                    <input type="number" id="coord-y" placeholder="Norte (Y)" step="any" inputmode="decimal">
                    <button id="btn-ir-coordenada" title="Ir a coordenadas">🎯 Ir</button>
                </div>

                <div class="section-title">Medicion</div>
                <div id="medir-box" class="mobile-row">
                    <button id="btn-medir" class="btn-medir" title="Clic en mapa = punto | Clic derecho = terminar">📏</button>
                    <button id="btn-limpiar-medir" class="btn-danger" title="Limpiar medicion">🗑️</button>
                </div>

                <div class="section-title">Archivos</div>
                <div id="file-input-box" class="mobile-row">
                    <label for="file-kml">Subir archivo:</label>
                    <input type="file" id="file-kml" accept=".kml,.kmz,.gpx,.geojson,.json">
                    <button id="btn-limpiar-kml" class="btn-danger" title="Limpiar KML">🗑️</button>
                </div>

                <div class="section-title">GPS</div>
                <div id="gps-box" class="mobile-row">
                    <button id="btn-gps" class="btn-gps-primary">📍 GPS</button>
                    <button id="btn-export-gps" class="btn-export">📤 Exportar Ruta</button>
                </div>
            </div>
        </div>

        <div id="map"></div>

        <!-- === SCRIPTS (orden importa) === -->

        <!-- 1. Utilidades compartidas (AppState, sanitize) — debe cargar PRIMERO -->
        <script src="js/util.js?v=1"></script>

        <!-- 2. Cargador dinámico de datos (GitHub → local fallback) -->
        <script src="js/cargar-datos.js?v=3"></script>

        </main>

    <!-- 3. Librerías (local — offline-first) -->
    <script src="leaflet/togeojson.js"></script>

    <!-- 4. Iconos RADA (SVG inline) -->
    <script src="js/iconos-rada.js"></script>

    <!-- 5. Módulos de funcionalidad -->
    <script src="js/gps.js?v=1"></script>
    <script src="js/search.js?v=1"></script>

    <!-- 6. Mapa principal (init, capas, checkboxes, toggle, abrirPDF) -->
    <script src="jsmapa/index.js?v=1"></script>

    <!-- 7. Funcionalidades complementarias -->
    <script src="js/descargas.js"></script>
    <script src="js/archivos.js?v=2"></script>
    <script src="js/coordenadas.js"></script>
    <script src="js/medir.js?v=1"></script>
</body>
</html>
