<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="imagenes/favicon.png">
    <link rel="icon" type="image/jpeg" href="imagenes/favicon.jpg">
    <meta name="msapplication-TileColor" content="#ffffff">
    <meta name="theme-color" content="#ffffff">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Visor GIS de la Autoridad Nacional del Agua - Madre de Dios">
    <title>Visor AAA Madre de Dios</title>

    <link rel="stylesheet" href="leaflet/leaflet.css">
    <script src="leaflet/leaflet.js"></script>

    <!-- Librerías de clusterización (solo las necesarias) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css">
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://unpkg.com/@mapbox/shp-write@0.4.3/shpwrite.js"></script>

    <link rel="stylesheet" href="css/estilosmapa.css?v=3"/>
    <link rel="stylesheet" href="css/celular.css?v=3" media="screen and (min-width: 320px)"/>
    <link rel="stylesheet" href="css/tablet.css?v=3" media="screen and (min-width: 768px)"/>
    <link rel="stylesheet" href="css/computadora.css?v=3" media="screen and (min-width: 1200px)"/>
    <link rel="stylesheet" href="css/estilos.css?v=3"/>
</head>

<body>
    <main class="container">
        <div id="controls" class="controls-collapsed">
            <!-- Header del panel (siempre visible) -->
            <div id="controls-header" onclick="toggleControls()">
                <span id="controls-title"><span id="hamburger-icon">☰</span> <span id="title-text">Controles</span></span>
                <span id="controls-arrow">▲</span>
            </div>

            <!-- Contenido del panel (colapsable) -->
            <div id="controls-body">
                <div class="capa-item">
                    <label><input type="checkbox" id="chkFaja"> Faja Marginal</label>
                    <span class="capa-btns">
                        <button class="btn-descarga" onclick="descargarCapa('faja')">KML</button>
                        <button class="btn-descarga" onclick="descargarCapaShp('faja')">SHP</button>
                    </span>
                </div>
                <div class="capa-item">
                    <label><input type="checkbox" id="chkHito"> Hitos Faja</label>
                    <span class="capa-btns">
                        <button class="btn-descarga" onclick="descargarCapa('hito')">KML</button>
                        <button class="btn-descarga" onclick="descargarCapaShp('hito')">SHP</button>
                    </span>
                </div>
                <div class="capa-item">
                    <label><input type="checkbox" id="chkAut"> Uso Temporal</label>
                    <span class="capa-btns">
                        <button class="btn-descarga" onclick="descargarCapa('uso')">KML</button>
                        <button class="btn-descarga" onclick="descargarCapaShp('uso')">SHP</button>
                    </span>
                </div>
                <div class="capa-item">
                    <label><input type="checkbox" id="chkRadaFuente"> RADA Fuente</label>
                    <span class="capa-btns">
                        <button class="btn-descarga" onclick="descargarCapa('rada')">KML</button>
                        <button class="btn-descarga" onclick="descargarCapaShp('rada')">SHP</button>
                    </span>
                </div>

                <div id="search-box">
                    <input type="text" id="buscar-input" placeholder="Buscar por resolución, CUT, nombre...">
                    <button id="btn-buscar">🔍</button>
                </div>

                <div class="section-title">Archivos</div>
                <div id="file-input-box" class="mobile-row">
                    <label for="file-kml">Subir archivo:</label>
                    <input type="file" id="file-kml" accept=".kml,.kmz,.gpx,.geojson,.json">
                    <button id="btn-limpiar-kml" class="btn-danger" title="Limpiar KML">🗑️</button>
                </div>

                <div class="section-title">GPS</div>
                <div id="gps-box" class="mobile-row">
                    <button id="btn-gps" class="btn-gps-primary">📍 GPS</button>
                    <button id="btn-export-gps" class="btn-export">📤 Exportar Ruta</button>
                </div>
            </div>
        </div>

        <div id="map"></div>

        <!-- Cargador dinámico de datos (GitHub primero, local como fallback) -->
        <script src="js/cargar-datos.js?v=2"></script>

        </main>

    <script src="https://unpkg.com/togeojson@0.16.0"></script>
    <script src="jsmapa/index.js"></script>
    <!-- Cargar archivos.js después del mapa -->
    <script src="js/descargas.js"></script>
    <script src="js/archivos.js"></script>
</body>
</html>
