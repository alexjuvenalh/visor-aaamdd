<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor AAA Madre de Dios v4 - API</title>
    <link rel="stylesheet" href="leaflet/leaflet.css">
    <script src="leaflet/leaflet.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
        #map { height: 100vh; width: 100%; }
        #controls {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: white;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 0 5px rgba(0,0,0,0.3);
        }
        #controls label { display: block; margin: 5px 0; cursor: pointer; }
        #status { font-size: 12px; color: #666; }
    </style>
</head>
<body>
    <div id="controls">
        <h3>Capas</h3>
        <div id="status">Cargando datos...</div>
        <label><input type="checkbox" id="chkFaja" disabled> Faja Marginal</label>
        <label><input type="checkbox" id="chkAut" disabled> Uso Temporal</label>
    </div>
    <div id="map"></div>

    <script>
    (function() {
        'use strict';

        var map = L.map('map').setView([-12.5933100, -69.1891300], 8);
        
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        var fajaData = null;
        var usoData = null;

        // Cargar datos desde la API
        fetch('http://localhost:3000/api/poligonos-faja')
            .then(function(r) { return r.json(); })
            .then(function(data) {
                fajaData = data;
                document.getElementById('status').textContent = 'Fajas: ' + (data.features ? data.features.length : 0);
                document.getElementById('chkFaja').disabled = false;
            })
            .catch(function(e) {
                document.getElementById('status').textContent = 'Error: ' + e.message;
            });

        fetch('http://localhost:3000/api/poligonos-autorizacion')
            .then(function(r) { return r.json(); })
            .then(function(data) {
                usoData = data;
                var s = document.getElementById('status').textContent;
                document.getElementById('status').textContent = s + ' | Aut: ' + (data.features ? data.features.length : 0);
                document.getElementById('chkAut').disabled = false;
            })
            .catch(function(e) {
                console.error('Error cargando autorizaciones:', e);
            });

        function prepararFeatures(data) {
            if (!data || !data.features) return null;
            
            var features = [];
            var problemas = 0;
            
            data.features.forEach(function(f, idx) {
                if (!f.geometry || typeof f.geometry === 'string') {
                    problemas++;
                    return;
                }
                if (!f.geometry.type || !f.geometry.coordinates) {
                    problemas++;
                    return;
                }
                features.push(f);
            });
            
            //alert('Features: ' + features.length + ' válidos, ' + problemas + ' problemas');
            
            if (features.length === 0) return null;
            
            return { type: 'FeatureCollection', features: features };
        }

        document.getElementById('chkFaja').onclick = function() {
            if (this.checked && fajaData) {
                var datos = prepararFeatures(fajaData);
                if (datos) {
                    fajaLayer = L.geoJson(datos, {
                        style: { color: '#ff7800', fillColor: '#ff7800', fillOpacity: 0.4 },
                        onEachFeature: function(feature, layer) {
                            var p = feature.properties;
                            layer.bindPopup(
                                '<center><b>' + (p.clase_resolucion || '') + '</b></center><br/>' +
                                '<b>Nombre Faja: </b>' + (p.nombre_faja_marginal || '') + '<br/>' +
                                '<b>Margen: </b>' + (p.margen || '') + '<br/>' +
                                '<b>N° Resolución: </b>' + (p.numero_resolucion || '') + '<br/>' +
                                '<b>Fecha: </b>' + (p.fecha_resolucion || '') + '<br/>' +
                                '<b>AAA: </b>' + (p.aaa || '') + '<br/>' +
                                '<b>ALA: </b>' + (p.ala || '') + '<br/>' +
                                '<b>Departamento: </b>' + (p.departamento || '') + '<br/>' +
                                '<b>Provincia: </b>' + (p.provincia || '') + '<br/>' +
                                '<b>Distrito: </b>' + (p.distrito || '') + '<br/>' +
                                '<b>Sector: </b>' + (p.sector || '') + '<br/>' +
                                '<b>Resumen: </b>' + (p.resumen || '') + '<br/>' +
                                "<b>Resolución: </b> <a target='_blank' href='http://www.ana.gob.pe/sites/default/files/normatividad/files/"+p.archivo+"'>"+p.archivo+"</a>"
                            );
                        }
                    }).addTo(map);
                }
            } else {
                if (fajaLayer) {
                    map.removeLayer(fajaLayer);
                    fajaLayer = null;
                }
            }
        };

        document.getElementById('chkAut').onclick = function() {
            if (this.checked && usoData) {
                var datos = prepararFeatures(usoData);
                if (datos) {
                    autLayer = L.geoJson(datos, {
                        style: { color: '#00ff00', fillColor: '#00ff00', fillOpacity: 0.4 },
                        onEachFeature: function(feature, layer) {
                            var p = feature.properties;
                            layer.bindPopup(
                                '<center><b>' + (p.clase_resolucion || '') + '</b></center><br/>' +
                                '<b>Área: </b>' + (p.area_otorgada || '') + '<br/>' +
                                '<b>Usuario: </b>' + (p.nombre_o_razon_social || '') + '<br/>' +
                                '<b>Documento: </b>' + (p.tipo_documento || '') + ' ' + (p.numero_documento || '') + '<br/>' +
                                '<b>N° Resolución: </b>' + (p.numero_resolucion || '') + '<br/>' +
                                '<b>Fecha: </b>' + (p.fecha_resolucion || '') + '<br/>' +
                                '<b>AAA: </b>' + (p.aaa || '') + '<br/>' +
                                '<b>ALA: </b>' + (p.ala || '') + '<br/>' +
                                '<b>Departamento: </b>' + (p.departamento || '') + '<br/>' +
                                '<b>Provincia: </b>' + (p.provincia || '') + '<br/>' +
                                '<b>Distrito: </b>' + (p.distrito || '') + '<br/>' +
                                '<b>Sector: </b>' + (p.sector || '') + '<br/>' +
                                '<b>Tipo: </b>' + (p.tipo_aut || '') + '<br/>' +
                                "<b>Resolución: </b> <a target='_blank' href='http://www.ana.gob.pe/sites/default/files/normatividad/files/"+p.archivo+"'>"+p.archivo+"</a>"
                            );
                        }
                    }).addTo(map);
                }
            } else {
                if (autLayer) {
                    map.removeLayer(autLayer);
                    autLayer = null;
                }
            }
        };
    })();
    </script>
</body>
</html>
