<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor AAA Madre de Dios v3</title>
    <link rel="stylesheet" href="leaflet/leaflet.css">
    <script src="leaflet/leaflet.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
        #map { height: 100vh; width: 100%; }
        #controls {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: white;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 0 5px rgba(0,0,0,0.3);
        }
        #controls label { display: block; margin: 5px 0; cursor: pointer; }
    </style>
</head>
<body>
    <div id="controls">
        <h3>Capas</h3>
        <label><input type="checkbox" id="chkFaja"> Faja Marginal</label>
        <label><input type="checkbox" id="chkAut"> Uso Temporal</label>
        <button id="btn-exportar">Exportar CSV</button>
    </div>
    <div id="map"></div>

    <script src="geojson/faja_marginal_v4.js"></script>

    <script>
    (function() {
        'use strict';

        var map = L.map('map').setView([-12.5933100, -69.1891300], 8);
        
        // OpenStreetMap - funciona offline si está cacheado
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        console.log('visor3.html cargado');
        console.log('faja_poligono:', typeof faja_poligono);
        console.log('uso_temporal:', typeof uso_temporal);

        // Función para validar y convertir geometrías
        function prepararFeatures(data) {
            if (!data || !data.features) {
                alert('No hay datos');
                return null;
            }
            
            var features = [];
            var problemas = 0;
            
            data.features.forEach(function(f, idx) {
                if (!f.geometry) {
                    problemas++;
                    return;
                }
                
                var g = f.geometry;
                
                // Si la geometría es un string (WKB), no sirve
                if (typeof g === 'string') {
                    console.log('Feature ' + idx + ' tiene geometría como string:', g.substring(0, 50));
                    problemas++;
                    return;
                }
                
                // Verificar que tenga type y coordinates
                if (!g.type || !g.coordinates) {
                    problemas++;
                    return;
                }
                
                features.push(f);
            });
            
            alert('Features: ' + features.length + ' válidos, ' + problemas + ' con problemas');
            console.log('features válidos:', features.length, 'problemas:', problemas);
            
            if (features.length === 0) {
                alert('No hay geometrías válidas para mostrar');
                return null;
            }
            
            return {
                type: 'FeatureCollection',
                features: features
            };
        }

        document.getElementById('chkFaja').onclick = function() {
            if (this.checked) {
                var datos = prepararFeatures(faja_poligono);
                if (datos) {
                    L.geoJson(datos, {
                        style: { color: '#ff7800', fillColor: '#ff7800', fillOpacity: 0.4 },
                        onEachFeature: function(f, l) {
                            var props = f.properties;
                            l.bindPopup('<b>' + (props.clase_resolucion || '') + '</b><br>' + 
                                'Nombre: ' + (props.nombre_faja_marginal || '') + '<br>' +
                                'Resolución: ' + (props.numero_resolucion || ''));
                        }
                    }).addTo(map);
                }
            }
        };

        document.getElementById('chkAut').onclick = function() {
            if (this.checked) {
                var datos = prepararFeatures(uso_temporal);
                if (datos) {
                    L.geoJson(datos, {
                        style: { color: '#00ff00', fillColor: '#00ff00', fillOpacity: 0.4 },
                        onEachFeature: function(f, l) {
                            var props = f.properties;
                            l.bindPopup('<b>' + (props.clase_resolucion || '') + '</b><br>' + 
                                'Usuario: ' + (props.nombre_o_razon_social || ''));
                        }
                    }).addTo(map);
                }
            }
        };

        document.getElementById('btn-exportar').onclick = function() {
            var csv = 'Tipo,Nombre,Resolución,Distrito\n';
            if (faja_poligono && faja_poligono.features) faja_poligono.features.forEach(function(f) {
                csv += 'Faja Marginal,' + (f.properties.nombre_faja_marginal||'') + ',' + (f.properties.numero_resolucion||'') + ',' + (f.properties.distrito||'') + '\n';
            });
            if (uso_temporal && uso_temporal.features) uso_temporal.features.forEach(function(f) {
                csv += 'Uso Temporal,' + (f.properties.nombre_o_razon_social||'') + ',' + (f.properties.numero_resolucion||'') + ',' + (f.properties.distrito||'') + '\n';
            });
            var a = document.createElement('a');
            a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
            a.download = 'datos.csv';
            a.click();
        };
    })();
    </script>
</body>
</html>
