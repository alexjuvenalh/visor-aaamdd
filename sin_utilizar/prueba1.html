<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Telematica S.A.</title>
  <style>
    html,
    body,
    #viewDiv {
      padding: 0;
      margin: 0;
      height: 95%;
      width: 100%;
    }
    #infoDiv {
        height: 100%;
        width: 100%;
        bottom: 10;
        font-family:Arial, Helvetica, sans-serif;
        font-size:15px;
        font-weight: bold;
    }
    body{
        background-color: linen;
    }
  </style>

  <!--URL del stylesheet de la API de ArcGIS para JavaScript -->
  <link rel="stylesheet" href="https://js.arcgis.com/4.14/esri/css/main.css">
  <!--URL de la libreria de la API de ArcGIS para JavaScript -->
  <script src="https://js.arcgis.com/4.14/"></script>

  <!-- Script para las funciones de JavaScript -->
  <script>
    require([
      "esri/Map",
      "esri/views/MapView",
      "dojo/domReady!"
    ], function(Map, MapView) {
      
     //--Creación de una clase Map
      var miMapa = new Map({
        basemap: "streets"
      });
      
      //--Creación de una clase MapView
      var miVista = new MapView({
        container: "viewDiv",
        map: miMapa,
        zoom: 15,
        //--Coordenadas de ubicación de Telematica
        center: [-77.010913, -12.089588] // Longitud, Latitud
      });

    });
    /** Función infoCantacto se invocara cuando se haga clic en el botón cantacto **/
    function infoContacto(){
      var info = "";
      info += "Telematica S.A.<br>";
      info += "Sistema de Información Geográfica<br>";
      info += "TEAM TRAINING<br>";
      info += "Telefono: 511-208-0400<br>";
      
      //Accessing the infoDiv element and setting it to a variable.
      var theDiv = document.getElementById("infoDiv");
      //Setting the content for the infoDiv element to display. 
      theDiv.innerHTML = info; 
    }
    /**Función infoEventos se invocara cuando se haga clic en la etiqueta href**/
    function infoEventos(){
        //Crea una variable que almacenara un elemento HTML tipo table, esta sera creada de manera dinamica utilizando JavaScript
        var info = "";
        info += "<center>";
        info += "<table border='2'>";
        info += "<tr><th>Evento</th><th>Cuando</th><th>Detalle</th></tr>";
        info += "<tr><td>ArcGIS I</td><td>Abril 22, 2020 9:00am-6:00pm</td><td>Curso de Introducción a la plataforma.</td></tr>";
        info += "<tr><td>ArcGIS II</td><td>Abril 23, 2020 9:00am-6:00pm</td><td>Curso de Edición de datos con ArcGIS.</td></tr>";
        info += "<tr><td>ArcGIS III</td><td>Abril 24, 2020 9:00am-6:00pm</td><td>Curso de Geoprocesamiento de datos.</td></tr>";
        info += "<tr><td>ArcGIS IV</td><td>Abril 25, 2020 9:00am-6:00pm</td><td>Curso compartiendo datos en la Web.</td></tr>";
        info += "</table>";
        info += "</center>";

        //Accessing the infoDiv element and setting it to a variable.
        var theDiv = document.getElementById("infoDiv");
        //Setting the content for the infoDiv element to display.
        theDiv.innerHTML = info;
    }
  </script>
</head>

<body>
  <!-- Elemento div que se usa como contenedor para visualizar el Mapa -->
  <div id="viewDiv"></div>
  <!-- Botón que invocara la funcion que mostrara la información del contacto -->
  <!-- <input type="button" id="btnContacto" value="Información de contacto" onclick="infoContacto()" /> -->

  <!-- Un elemento href tambien se puede usa para llamar a la funcion infoContacto y mostrar
        la información del contacto -->
  <a id="contactLink" href="#" onclick="infoContacto();">Información de Contacto</a>
  <!-- Utilizamos elemento href para invocar a la función infoEventos y mostrar información de eventos-->
  <a id="eventsLink" href="#" onclick="infoEventos();">Eventos Locales</a>
  <!-- Elemento div que se usa como contenedor para visualizar una tabla con la información de eventos -->
  <div id="infoDiv"></div>
</body>
</html>
