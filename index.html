<!DOCTYPE html>

<head>

    <link rel="stylesheet" href="leaflet/leaflet.css">

    <style>
        .capa-item { display: flex; align-items: center; gap: 5px; margin: 3px 0; }
        .capa-btns { display: inline-flex; gap: 3px; margin-left: 5px; }
        .btn-descarga { font-size: 9px; padding: 2px 6px; cursor: pointer; background: #607D8B; color: white; border: none; border-radius: 3px; }
        .btn-descarga:hover { background: #455A64; }
    </style>
</head>

<body>
    <main class="container">
        <div id="controls">
            <div class="capa-item">
                <label><input type="checkbox" id="chkFaja"> Faja Marginal</label>
                <span class="capa-btns">
                    <button class="btn-descarga" onclick="descargarCapa('faja')">KML</button>
                    <button class="btn-descarga" onclick="descargarCapaShp('faja')">SHP</button>
                </span>
            </div>
            <div class="capa-item">
                <label><input type="checkbox" id="chkHito"> Hitos Faja</label>
                <span class="capa-btns">
                    <button class="btn-descarga" onclick="descargarCapa('hito')">KML</button>
                    <button class="btn-descarga" onclick="descargarCapaShp('hito')">SHP</button>
                </span>
            </div>
            <div class="capa-item">
                <label><input type="checkbox" id="chkAut"> Uso Temporal</label>
                <span class="capa-btns">
                    <button class="btn-descarga" onclick="descargarCapa('uso')">KML</button>
                    <button class="btn-descarga" onclick="descargarCapaShp('uso')">SHP</button>
                </span>
            </div>
            <div class="capa-item">
                <label><input type="checkbox" id="chkRadaFuente"> RADA Fuente</label>
                <span class="capa-btns">
                    <button class="btn-descarga" onclick="descargarCapa('rada')">KML</button>
                    <button class="btn-descarga" onclick="descargarCapaShp('rada')">SHP</button>
                </span>
            </div>

            <div id="search-box">
                <input type="text" id="buscar-input" placeholder="Buscar...">
                <button id="btn-buscar">🔍</button>
            </div>

            <div id="export-box">
                <button id="btn-exportar">📥 Exportar</button>
            </div>

            <div id="file-input-box" style="margin-top: 10px;">
                <label for="file-kml" style="font-size:11px; font-weight:bold;">Subir archivo:</label><br>
                <input type="file" id="file-kml" accept=".kml,.kmz,.gpx,.geojson,.json" style="font-size:10px;">
                <button id="btn-limpiar-kml" title="Limpiar KML" style="margin-left:5px; font-size:10px; padding:2px 6px; cursor:pointer; background:#f44336; color:white; border:none; border-radius:3px;">🗑️</button>
            </div>

            <div id="gps-box" style="margin-top: 10px;">
                <button id="btn-gps" title="Iniciar/detener seguimiento GPS" style="font-size:10px; padding:3px 8px; cursor:pointer; background:#4CAF50; color:white; border:none; border-radius:3px;">📍 GPS</button>
                <button id="btn-export-gps" title="Exportar ruta" style="margin-left:5px; font-size:10px; padding:3px 8px; cursor:pointer; background:#FF9800; color:white; border:none; border-radius:3px;">📤 Exportar Ruta</button>
            </div>
        </div>

        <div id="map"></div>

        <!-- Datos locales (modo offline) -->
        <script src="visor/geojson/faja_poligono.js"></script>
        <script src="visor/geojson/faja_hito.js"></script>
        <script src="visor/geojson/uso_temporal.js"></script>
        <script src="visor/geojson/rada_fuente.js"></script>
        <script>
            // Asignar datos locales
            window.faja_poligono = faja_poligono;
            window.faja_hito = faja_hito;
            window.uso_temporal = uso_temporal;
            window.rada_por_fuente = (typeof rada_fuente !== 'undefined') ? rada_fuente : { type: 'FeatureCollection', features: [] };
            window.rada_por_derecho = { type: 'FeatureCollection', features: [] };
            console.log('Faja Marginal cargada:', faja_poligono.features.length);
            console.log('Hitos Faja cargados:', faja_hito.features.length);
            console.log('Uso Temporal cargado:', uso_temporal.features.length);
            console.log('RADA Fuente cargado:', typeof rada_fuente !== 'undefined' ? rada_fuente.features.length : 'NO DEFINIDO');
            console.log('chkRadaFuente element:', document.getElementById('chkRadaFuente'));
        </script>

        <!-- Funciones para descargar capas -->
        <script>
            // Colores para categorización de RADA por Uso
            var coloresRADA = {
                'Acuícola': 'ff00ffff',      // Cyan
                'Minero': 'ffbf00ff',        // Amarillo
                'Poblacional': 'ff0000ff',    // Rojo
                'Otros Usos': 'ff808080',    // Gris
                'Agrícola': 'ff00ff00',      // Verde
                'Doméstico - Poblacional': 'ff0080ff', // Naranja
                'Industrial': 'ff8000ff',    // Púrpura
                'Recreativo': 'ff00bf00',    // Lima
                'Pecuario': 'ff804000',      // Marrón
                'Energético': 'ff0000ff',    // Azul
                'Turístico': 'ffff00ff'      // Rosa
            };
            
            // Convertir GeoJSON a KML para RADA con categorización por Uso
            function geojsonToKMLRADA(geojson) {
                var kml = '<?xml version="1.0" encoding="UTF-8"?>\n';
                kml += '<kml xmlns="http://www.opengis.net/kml/2.2">\n';
                kml += '<Document>\n';
                kml += '  <name>RADA Fuente</name>\n';
                
                // Crear estilos para cada Uso - con círculos y letra pequeña
                var usos = {};
                geojson.features.forEach(function(f) {
                    var uso = f.properties.Uso || 'Otro';
                    if (!usos[uso]) usos[uso] = true;
                });
                
                for (var uso in usos) {
                    var color = coloresRADA[uso] || 'ff808080';
                    kml += '  <Style id="rada-' + uso.replace(/[^a-zA-Z0-9]/g, '_') + '">\n';
                    // Usar icono de círculo
                    kml += '    <IconStyle>\n';
                    kml += '      <color>' + color + '</color>\n';
                    kml += '      <scale>0.5</scale>\n';
                    kml += '      <Icon><href>http://maps.google.com/mapfiles/kml/paddle/wht-circle.png</href></Icon>\n';
                    kml += '    </IconStyle>\n';
                    // Letra pequeña
                    kml += '    <LabelStyle><color>' + color + '</color><scale>0.5</scale></LabelStyle>\n';
                    kml += '  </Style>\n';
                }
                
                geojson.features.forEach(function(feature, i) {
                    var uso = feature.properties.Uso || 'Otro';
                    var nombre = feature.properties.Usuario || feature.properties.Lugar_Uso || ('Punto ' + (i + 1));
                    var resolucion = feature.properties['Resolucin'] || feature.properties['Resolución'] || '';
                    
                    var styleId = 'rada-' + uso.replace(/[^a-zA-Z0-9]/g, '_');
                    
                    // Solo mostrar Uso como nombre (más pequeño)
                    kml += '  <Placemark>\n';
                    kml += '    <name><![CDATA[' + uso + ']]></name>\n';
                    kml += '    <styleUrl>#' + styleId + '</styleUrl>\n';
                    
                    var desc = '';
                    for (var key in feature.properties) {
                        if (feature.properties[key]) desc += key + ': ' + feature.properties[key] + '\n';
                    }
                    kml += '    <description><![CDATA[' + desc + ']]></description>\n';
                    
                    if (feature.geometry.type === 'Point') {
                        var coords = feature.geometry.coordinates;
                        kml += '    <Point><coordinates>' + coords[0] + ',' + coords[1] + ',0</coordinates></Point>\n';
                    }
                    
                    kml += '  </Placemark>\n';
                });
                
                kml += '</Document>\n</kml>';
                return kml;
            }
            
            // Convertir GeoJSON a KML con estilos
            function geojsonToKML(geojson, nombreCapa, tipoCapa) {
                // Definir estilos según tipo de capa
                var estilos = {
                    faja: { color: 'ff0000ff', colorName: 'red', fill: 0, outline: 1 },      // Rojo, solo contorno
                    hito: { color: 'ff800080', colorName: 'purple', fill: 1, outline: 1 },   // Morado
                    uso: { color: 'ffff0000', colorName: 'blue', fill: 0, outline: 1 }       // Azul, solo contorno
                };
                
                var estilo = estilos[tipoCapa] || estilos.faja;
                
                var kml = '<?xml version="1.0" encoding="UTF-8"?>\n';
                kml += '<kml xmlns="http://www.opengis.net/kml/2.2">\n';
                kml += '<Document>\n';
                kml += '  <name>' + nombreCapa + '</name>\n';
                
                // Definir estilo
                kml += '  <Style id="' + tipoCapa + '">\n';
                if (geojson.features[0] && geojson.features[0].geometry.type === 'Point') {
                    // Para puntos (hitos), usar icono circular
                    kml += '    <IconStyle><color>' + estilo.color + '</color><scale>0.8</scale><heading>0</heading></IconStyle>\n';
                    kml += '    <LabelStyle><color>' + estilo.color + '</color><scale>0.8</scale></LabelStyle>\n';
                    kml += '    <BalloonStyle><text>$[name]</text></BalloonStyle>\n';
                } else {
                    kml += '    <LineStyle><color>' + estilo.color + '</color><width>3</width></LineStyle>\n';
                    kml += '    <PolyStyle><color>' + (estilo.fill ? estilo.color : '00000000') + '</color><outline>' + estilo.outline + '</outline></PolyStyle>\n';
                }
                kml += '  </Style>\n';
                
                // Estilo para etiqueta de resolución en uso temporal
                if (tipoCapa === 'uso') {
                    kml += '  <Style id="uso-resolucion">\n';
                    kml += '    <LabelStyle>\n';
                    kml += '      <color>ffff0000</color>\n';
                    kml += '      <scale>0.8</scale>\n';
                    kml += '    </LabelStyle>\n';
                    kml += '    <IconStyle>\n';
                    kml += '      <color>00000000</color>\n';
                    kml += '    </IconStyle>\n';
                    kml += '  </Style>\n';
                }
                
                // Agregar estilo de icono para puntos
                if (geojson.features[0] && geojson.features[0].geometry.type === 'Point') {
                    kml += '  <Style id="hito-icon">\n';
                    kml += '    <IconStyle>\n';
                    kml += '      <color>ff800080</color>\n';
                    kml += '      <scale>0.6</scale>\n';
                    kml += '      <Icon><href>http://maps.google.com/mapfiles/kml/paddle/wht-circle.png</href></Icon>\n';
                    kml += '    </IconStyle>\n';
                    kml += '    <LabelStyle>\n';
                    kml += '      <color>ff800080</color>\n';
                    kml += '      <scale>0.8</scale>\n';
                    kml += '    </LabelStyle>\n';
                    kml += '  </Style>\n';
                }
                
                geojson.features.forEach(function(feature, i) {
                    // Nombre según tipo de capa
                    var nombre;
                    if (tipoCapa === 'hito') {
                        nombre = feature.properties.hito || ('Hito ' + (i + 1));
                    } else if (tipoCapa === 'faja') {
                        nombre = feature.properties.nombre_faja_marginal || feature.properties.nombre_faja || ('Polígono ' + (i + 1));
                    } else {
                        nombre = feature.properties.nombre_o_razon_social || ('Autorización ' + (i + 1));
                    }
                    
                    kml += '  <Placemark>\n';
                    kml += '    <name><![CDATA[' + nombre + ']]></name>\n';
                    // Para hitos (puntos), usar estilo de círculo
                    var styleRef = (tipoCapa === 'hito' && feature.geometry.type === 'Point') ? '#hito-icon' : '#' + tipoCapa;
                    kml += '    <styleUrl>' + styleRef + '</styleUrl>\n';
                    
                    var desc = '';
                    for (var key in feature.properties) {
                        if (feature.properties[key]) desc += key + ': ' + feature.properties[key] + '\n';
                    }
                    kml += '    <description><![CDATA[' + desc + ']]></description>\n';
                    
                    if (feature.geometry.type === 'Point') {
                        var coords = feature.geometry.coordinates;
                        kml += '    <Point><coordinates>' + coords[0] + ',' + coords[1] + ',0</coordinates></Point>\n';
                    } else if (feature.geometry.type === 'LineString') {
                        kml += '    <LineString><coordinates>';
                        feature.geometry.coordinates.forEach(function(c) { kml += c[0] + ',' + c[1] + ',0 '; });
                        kml += '</coordinates></LineString>\n';
                    } else if (feature.geometry.type === 'Polygon') {
                        kml += '    <Polygon><outerBoundaryIs><LinearRing><coordinates>';
                        feature.geometry.coordinates[0].forEach(function(c) { kml += c[0] + ',' + c[1] + ',0 '; });
                        kml += '</coordinates></LinearRing></outerBoundaryIs></Polygon>\n';
                    }
                    
                    kml += '  </Placemark>\n';
                    
                    // Para uso temporal, agregar etiqueta con número de resolución en el centro (como Placemark separado)
                    if (tipoCapa === 'uso' && feature.geometry.type === 'Polygon' && feature.properties.numero_resolucion) {
                        var ring = feature.geometry.coordinates[0];
                        var sumLng = 0, sumLat = 0;
                        ring.forEach(function(c) { sumLng += c[0]; sumLat += c[1]; });
                        var centroLng = sumLng / ring.length;
                        var centroLat = sumLat / ring.length;
                        
                        kml += '  <Placemark>\n';
                        kml += '    <name><![CDATA[' + feature.properties.numero_resolucion + ']]></name>\n';
                        kml += '    <styleUrl>#uso-resolucion</styleUrl>\n';
                        kml += '    <Point><coordinates>' + centroLng + ',' + centroLat + ',0</coordinates></Point>\n';
                        kml += '  </Placemark>\n';
                    }
                });
                
                kml += '</Document>\n</kml>';
                return kml;
            }

            // Descargar como KML
            function descargarCapa(capa) {
                var geojson, nombre, tipo;
                if (capa === 'faja') { geojson = window.faja_poligono; nombre = 'Faja_Marginal'; tipo = 'faja'; }
                else if (capa === 'hito') { geojson = window.faja_hito; nombre = 'Hitos_Faja'; tipo = 'hito'; }
                else if (capa === 'uso') { geojson = window.uso_temporal; nombre = 'Uso_Temporal'; tipo = 'uso'; }
                else if (capa === 'rada') { geojson = window.rada_por_fuente; nombre = 'RADA_Fuente'; tipo = 'rada'; }
                
                if (!geojson || !geojson.features || geojson.features.length === 0) {
                    alert('No hay datos para descargar');
                    return;
                }
                
                // Si es RADA, usar función especial con categorización por Uso
                if (capa === 'rada') {
                    var kml = geojsonToKMLRADA(geojson);
                } else {
                    var kml = geojsonToKML(geojson, nombre, tipo);
                }
                var blob = new Blob([kml], { type: 'application/vnd.google-earth.kml+xml' });
                var link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = nombre + '_' + Date.now() + '.kml';
                link.click();
            }

            // Descargar como SHP (usando togeojson + shpwrite desde CDN diferente)
            function descargarCapaShp(capa) {
                var geojson, nombre;
                if (capa === 'faja') { geojson = window.faja_poligono; nombre = 'Faja_Marginal'; }
                else if (capa === 'hito') { geojson = window.faja_hito; nombre = 'Hitos_Faja'; }
                else if (capa === 'uso') { geojson = window.uso_temporal; nombre = 'Uso_Temporal'; }
                else if (capa === 'rada') { geojson = window.rada_por_fuente; nombre = 'RADA_Fuente'; }
                
                if (!geojson || !geojson.features || geojson.features.length === 0) {
                    alert('No hay datos para descargar');
                    return;
                }
                
                // Descargar como GeoJSON (compatible con QGIS, ArcGIS, etc.)
                var jsonStr = JSON.stringify(geojson, null, 2);
                var blob = new Blob([jsonStr], { type: 'application/json' });
                var link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = nombre + '_' + Date.now() + '.geojson';
                link.click();
                
                alert('Se descargó como GeoJSON (.geojson)\n\nEste formato es compatible con:\n- QGIS\n- ArcGIS\n- Google Earth\n\nPara convertir a SHP, usa QGIS: Capa > Importar > guardar como > Shapefile');
            }
        </script>
    </main>

    <script src="https://unpkg.com/togeojson@0.16.0"></script>
    <script src="https://unpkg.com/leaflet-filelayer@1.2.0"></script>
    <script src="jsmapa/index.js"></script>

    <!-- Script para cargar archivos KML/GPX/GeoJSON -->
    <script>
        var kmlLayer = null;

        function sanitize(str) {
            if (str == null) return '';
            var div = document.createElement('div');
            div.textContent = String(str);
            return div.innerHTML;
        }

        function parsearKMLManual(text) {
            var parser = new DOMParser();
            var doc = parser.parseFromString(text, 'text/xml');
            var features = [];
            var placemarks = doc.querySelectorAll('Placemark');
            for (var i = 0; i < placemarks.length; i++) {
                var pm = placemarks[i];
                var name = pm.querySelector('name');
                var desc = pm.querySelector('description');
                var geometry = null;
                var point = pm.querySelector('Point');
                if (point) {
                    var coordText = point.querySelector('coordinates');
                    if (coordText && coordText.textContent) {
                        var parts = coordText.textContent.trim().split(',');
                        if (parts.length >= 2) {
                            geometry = { type: 'Point', coordinates: [parseFloat(parts[0]), parseFloat(parts[1])] };
                        }
                    }
                }
                if (!geometry) {
                    var line = pm.querySelector('LineString');
                    if (line) {
                        var coordText = line.querySelector('coordinates');
                        if (coordText && coordText.textContent) {
                            var coordPairs = coordText.textContent.trim().split(/\s+/);
                            var coords = [];
                            for (var j = 0; j < coordPairs.length; j++) {
                                var cp = coordPairs[j].trim();
                                if (cp) {
                                    var parts = cp.split(',');
                                    if (parts.length >= 2) coords.push([parseFloat(parts[0]), parseFloat(parts[1])]);
                                }
                            }
                            if (coords.length > 0) geometry = { type: 'LineString', coordinates: coords };
                        }
                    }
                }
                if (!geometry) {
                    var polygon = pm.querySelector('Polygon');
                    if (polygon) {
                        var ring = polygon.querySelector('LinearRing');
                        if (ring) {
                            var coordText = ring.querySelector('coordinates');
                            if (coordText && coordText.textContent) {
                                var coordPairs = coordText.textContent.trim().split(/\s+/);
                                var coords = [];
                                for (var j = 0; j < coordPairs.length; j++) {
                                    var cp = coordPairs[j].trim();
                                    if (cp) {
                                        var parts = cp.split(',');
                                        if (parts.length >= 2) coords.push([parseFloat(parts[0]), parseFloat(parts[1])]);
                                    }
                                }
                                if (coords.length > 0) geometry = { type: 'Polygon', coordinates: [coords] };
                            }
                        }
                    }
                }
                if (geometry) {
                    features.push({ type: 'Feature', properties: { name: name ? name.textContent : '', description: desc ? desc.textContent : '' }, geometry: geometry });
                }
            }
            return { type: 'FeatureCollection', features: features };
        }

        function inicializar() {
            var fileInput = document.getElementById('file-kml');
            if (!fileInput) { setTimeout(inicializar, 300); return; }
            fileInput.onclick = function(e) { e.target.value = ''; };
            fileInput.onchange = function(e) {
                var file = e.target.files[0];
                if (!file) return;
                if (!window.map) return;
                procesarArchivo(file);
            };
            var btnLimpiar = document.getElementById('btn-limpiar-kml');
            if (btnLimpiar) {
                btnLimpiar.onclick = function() {
                    if (kmlLayer && window.map) {
                        window.map.removeLayer(kmlLayer);
                        kmlLayer = null;
                        document.getElementById('file-kml').value = '';
                    }
                };
            }
        }

        function procesarArchivo(file) {
            var ext = file.name.split('.').pop().toLowerCase();
            var reader = new FileReader();
            reader.onload = function(event) {
                var text = event.target.result;
                var geojson = null;
                if (ext === 'kml') {
                    if (typeof toGeoJSON !== 'undefined') {
                        var parser = new DOMParser();
                        var doc = parser.parseFromString(text, 'text/xml');
                        geojson = toGeoJSON.kml(doc);
                    }
                    if (!geojson || !geojson.features || geojson.features.length === 0) {
                        geojson = parsearKMLManual(text);
                    }
                } else if (ext === 'gpx') {
                    if (typeof toGeoJSON !== 'undefined') {
                        var parser = new DOMParser();
                        var doc = parser.parseFromString(text, 'text/xml');
                        geojson = toGeoJSON.gpx(doc);
                    }
                } else if (ext === 'json' || ext === 'geojson') {
                    geojson = JSON.parse(text);
                }
                if (!geojson || !geojson.features || geojson.features.length === 0) return;
                var mapa = window.map;
                if (kmlLayer) mapa.removeLayer(kmlLayer);
                kmlLayer = L.geoJson(geojson, {
                    style: { color: '#ff0000', weight: 3 },
                    pointToLayer: function(f, latlng) { return L.circleMarker(latlng, { radius: 8, fillColor: '#ff0000', fillOpacity: 1 }); },
                    onEachFeature: function(feature, layer) {
                        var props = feature.properties || {};
                        var content = '<b>Feature</b><br/>';
                        for (var key in props) content += key + ': ' + sanitize(props[key]) + '<br/>';
                        layer.bindPopup(content);
                    }
                }).addTo(mapa);
                document.getElementById('file-kml').value = '';
                var bounds = kmlLayer.getBounds();
                if (bounds.isValid()) mapa.fitBounds(bounds);
            };
            reader.readAsText(file);
        }

        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', inicializar);
        else inicializar();
    </script>
</body>
