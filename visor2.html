<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor AAA Madre de Dios v2</title>
    <link rel="stylesheet" href="leaflet/leaflet.css">
    <script src="leaflet/leaflet.js"></script>
    <script src="leaflet-search-master\src\leaflet-search.js"></script>
    <link rel="stylesheet" href="leaflet-search-master\src\leaflet-search.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css">
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <script src="https://maps.google.com/maps/api/js?v=3.2&sensor=false"></script>
    <link rel="stylesheet" href="css/estilosmapa.css"/>
    <link rel="stylesheet" href="css/celular.css" media="screen and (min-width: 320px)"/>
    <link rel="stylesheet" href="css/tablet.css" media="screen and (min-width: 768px)"/>
    <link rel="stylesheet" href="css/computadora.css" media="screen and (min-width: 1200px)"/>
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
        #map { height: calc(100vh - 50px); width: 100%; }
        #controls {
            height: 50px;
            background: #f5f5f5;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 1px solid #ddd;
        }
        #controls label { cursor: pointer; }
        #btn-exportar {
            background: #e67e22;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            margin-left: auto;
        }
    </style>
</head>
<body>
    <div id="controls">
        <label><input type="checkbox" id="chkFaja"> Faja Marginal</label>
        <label><input type="checkbox" id="chkHito"> Hitos</label>
        <label><input type="checkbox" id="chkAut"> Uso Temporal</label>
        <label><input type="checkbox" id="chkRadaFuente"> RADA Fuente</label>
        <label><input type="checkbox" id="chkRadaDerecho"> RADA Derecho</label>
        <button id="btn-exportar">Exportar CSV</button>
    </div>
    <div id="map"></div>

    <script src="geojson/faja_poligono.js"></script>
    <script src="geojson/faja_hito.js"></script>
    <script src="geojson/uso_temporal.js"></script>
    <script src="geojson/rada_por_fuente.js"></script>
    <script src="geojson/rada_por_derecho.js"></script>

    <script src="https://unpkg.com/togeojson@0.16.0"></script>
    <script src="https://unpkg.com/leaflet-filelayer@1.2.0"></script>

    <script>
    (function() {
        'use strict';

        var map, L = window.L;

        function init() {
            map = L.map('map').setView([-12.5933100, -69.1891300], 8);
            
            L.tileLayer('https://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}', {
                maxZoom: 20,
                subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
            }).addTo(map);

            // Leyenda
            var legend = L.control({position: 'bottomright'});
            legend.onAdd = function() {
                var div = L.DomUtil.create('div', 'info legend');
                div.innerHTML = '<h4>Leyenda</h4><div><span style="background:#ff7800;width:12px;height:12px;display:inline-block;margin-right:5px;border-radius:2px;"></span> Faja Marginal</div><div><span style="background:#00ff00;width:12px;height:12px;display:inline-block;margin-right:5px;border-radius:2px;"></span> Uso Temporal</div><div><span style="background:#0000ff;width:12px;height:12px;display:inline-block;margin-right:5px;border-radius:50%;"></span> RADA</div>';
                return div;
            };
            legend.addTo(map);

            console.log('Mapa inicializado');
            console.log('faja_poligono:', typeof faja_poligono, faja_poligono ? faja_poligono.features.length : 'N/A');
            console.log('uso_temporal:', typeof uso_temporal, uso_temporal ? uso_temporal.features.length : 'N/A');
        }

        // Validar y filtrar geometrías
        function validarGeoJSON(data) {
            if (!data || !data.features) return null;
            var validos = [];
            var invalidos = 0;
            data.features.forEach(function(f, i) {
                if (f.geometry && f.geometry.type && f.geometry.coordinates && f.geometry.coordinates.length > 0) {
                    validos.push(f);
                } else {
                    invalidos++;
                }
            });
            console.log('Features válidos:', validos.length, '| Inválidos:', invalidos);
            return { type: 'FeatureCollection', features: validos };
        }

        // Event listeners
        document.getElementById('chkFaja').onclick = function() {
            if (this.checked && faja_poligono) {
                alert('DEBUG: Intentando renderizar faja_poligono con ' + faja_poligono.features.length + ' features');
                var fajaValida = validarGeoJSON(faja_poligono);
                if (fajaValida && fajaValida.features.length > 0) {
                    alert('DEBUG: geometrías válidas, renderizando...');
                    L.geoJson(fajaValida, {
                        style: { color: '#ff7800', fillColor: '#ff7800', fillOpacity: 0.4 },
                        onEachFeature: function(f, l) {
                            l.bindPopup('<b>' + f.properties.clase_resolucion + '</b><br>' + 
                                'Nombre: ' + f.properties.nombre_faja_marginal + '<br>' +
                                'Resolución: ' + f.properties.numero_resolucion);
                        }
                    }).addTo(map);
                    console.log('Capa Faja Marginal renderizada con', fajaValida.features.length, 'features');
                }
            }
        };

        document.getElementById('chkAut').onclick = function() {
            if (this.checked && uso_temporal) {
                var autValida = validarGeoJSON(uso_temporal);
                if (autValida && autValida.features.length > 0) {
                    L.geoJson(autValida, {
                        style: { color: '#00ff00', fillColor: '#00ff00', fillOpacity: 0.4 },
                        onEachFeature: function(f, l) {
                            l.bindPopup('<b>' + f.properties.clase_resolucion + '</b><br>' + 
                                'Usuario: ' + f.properties.nombre_o_razon_social);
                        }
                    }).addTo(map);
                    console.log('Capa Uso Temporal renderizada con', autValida.features.length, 'features');
                }
            }
        };

        document.getElementById('btn-exportar').onclick = function() {
            var csv = 'Tipo,Nombre,Resolución,Distrito\n';
            if (faja_poligono) faja_poligono.features.forEach(function(f) {
                csv += 'Faja Marginal,' + (f.properties.nombre_faja_marginal||'') + ',' + (f.properties.numero_resolucion||'') + ',' + (f.properties.distrito||'') + '\n';
            });
            if (uso_temporal) uso_temporal.features.forEach(function(f) {
                csv += 'Uso Temporal,' + (f.properties.nombre_o_razon_social||'') + ',' + (f.properties.numero_resolucion||'') + ',' + (f.properties.distrito||'') + '\n';
            });
            var a = document.createElement('a');
            a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
            a.download = 'datos.csv';
            a.click();
        };

        window.onload = init;
    })();
    </script>
</body>
</html>
